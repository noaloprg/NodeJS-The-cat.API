services:
  postgres_DLTCat: 
    image: postgres:17.0-alpine3.20
    ports: 
      - "${POSTGRES_PORT_PC}:5432" 
    environment: 
      POSTGRES_USER: ${POSTGRES_DOCKER_USER}
      POSTGRES_PASSWORD: ${POSTGRES_DOCKER_ROOT_PASSWORD}
      POSTGRES_DB: "db_${APP_NAME}"
    volumes:
      - dltcat_data:/var/lib/postgresql/data
  
  app_dltcat:
    build: . #Searches in the same path a dockerfile
    container_name: app_dltcat
    ports: 
    - "3000:3000" # Port of the image 
    restart: always # always restarts in case of errors 
volumes:
  dltcat_data: